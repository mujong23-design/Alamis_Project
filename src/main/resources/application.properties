spring.application.name=inventory

# Server
server.port=${PORT:8080}

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# PostgreSQL DataSource (Neon Cloud)
# 로컬: 아래 기본값 사용 / 운영: 환경변수로 덮어쓰기
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-curly-feather-aoek1l8t-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:alamis_mng}
spring.datasource.password=${DB_PASS:npg_5sWMwHFhcma2}

# HikariCP — Neon은 슬립 후 첫 접속이 1~2초 느릴 수 있어 타임아웃 여유있게
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Schema 자동 실행 (PostgreSQL 모드)
# - schema.sql 은 CREATE TABLE IF NOT EXISTS 이므로 기존 데이터 영향 없음
# - 데이터 시드는 사용하지 않음 (실제 DB에서 직접 관리)
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.inventory.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Jackson — LocalDate / LocalDateTime 를 ISO 문자열로 출력 (yyyy-MM-dd)
spring.jackson.serialization.write-dates-as-timestamps=false

# Log
logging.level.com.inventory=debug
logging.level.org.mybatis=debug
